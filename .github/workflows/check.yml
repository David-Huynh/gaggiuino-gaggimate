on: [push, pull_request]

jobs:
  brew-start-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test tare and process lifecycle without hardware
        run: python scripts/test_brew_start.py
      - name: Test boot and native-task storage ownership
        run: python scripts/test_storage_ownership.py
      - name: Test Wi-Fi startup and hotspot recovery
        run: python scripts/test_wifi_startup.py
      - name: Test web startup error reporting
        run: node --test web/src/utils/brewStartError.test.js web/src/utils/temperatureTarget.test.js

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Run static code analysis for display
        continue-on-error: true
        run: platformio check -e display --fail-on-defect=medium -f "-<*>" -f "+<src/display/>" -f "-<src/display/ui>"
      - name: Run static code analysis for controller
        run: platformio check -e controller --fail-on-defect=medium -f "-<*>" -f "+<src/controller/>"

  uart-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build WebUI
        run: ./scripts/build_webui.sh
      - name: Build UART ESP32 display
        run: platformio run -e display-headless-uart
      - name: Build UART ESP32 N16R8 display
        run: platformio run -e display-headless-uart-n16r8
      - name: Test saved-shot recovery with firmware codecs
        run: python scripts/test_artifact_recovery.py
      - name: Check ESP32 saved-shot decoder stack budgets
        run: python scripts/test_artifact_stack.py
      - name: Build UART STM32 controller
        run: platformio run -e stm32f4
      - name: Test heater safety and independent controller restarts
        run: python scripts/test_heater_safety.py
      - name: Build STM32 OTA development firmware
        env:
          # RFC 8032 fixture key for simulation builds only.
          GAGGIMATE_STM32_OTA_PUBLIC_KEY: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
        run: platformio run -e stm32f4-bootloader -e stm32f4-ota-app
      - name: Simulate STM32 OTA UART transfers and interrupted flash writes
        run: python scripts/test_stm32_ota.py --image .pio/build/stm32f4-ota-app/firmware.bin
